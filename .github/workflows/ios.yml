name: iOS build & test

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No iPhone simulator found")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ThongTinCongNhan.xcodeproj \
            -scheme ThongTinCongNhan \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -iE "error:|warning: .*ThongTinCongNhan/|test case .*(passed|failed)|\*\* TEST" || true
          echo "Passed: $(grep -ciE "test case .* passed" test.log) · Failed: $(grep -ciE "test case .* failed" test.log)"
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log
          grep -qiE "test case .* passed" test.log

      - name: Build unsigned IPA (cài bằng Sideloadly / AltStore)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ThongTinCongNhan.xcodeproj \
            -scheme ThongTinCongNhan \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ThongTinCongNhan.app Payload/
          zip -qry ThongTinCongNhan-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThongTinCongNhan-ipa
          path: ThongTinCongNhan-unsigned.ipa
          retention-days: 30

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 7
